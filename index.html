<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<meta name="description" content="Rain's World: a little pixel world where Rain the cat keeps everything we built together.">
<title>Rain's World</title>
<link rel="icon" href="assets/rooms-icon.png">
<link rel="apple-touch-icon" href="assets/rooms-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Rain's World game"></canvas>

<div id="hud">
  <div id="title">RAIN'S WORLD</div>
  <div id="buttons">
    <button id="btnPlaces" title="Places (M)" aria-label="Places">&#9776;</button>
    <button id="btnRain" title="Rain on/off (R)" aria-label="Toggle rain">&#9730;</button>
    <button id="btnSound" title="Music on/off (N)" aria-label="Toggle music">&#9835;<s></s></button>
  </div>
</div>

<div id="toast" class="pixel-box hidden"></div>
<div id="prompt" class="hidden"></div>

<div id="dialog" class="pixel-box hidden" role="dialog" aria-modal="false" aria-labelledby="dlgTitle">
  <button id="dlgClose" aria-label="Close">&times;</button>
  <div id="dlgHead">
    <canvas id="dlgIcon" width="16" height="16"></canvas>
    <div>
      <div id="dlgTag"></div>
      <h2 id="dlgTitle"></h2>
    </div>
  </div>
  <div id="dlgMedia"></div>
  <p id="dlgBody"></p>
  <div id="dlgLinks"></div>
  <div id="dlgCredit"></div>
</div>

<div id="places" class="pixel-box hidden" role="dialog" aria-label="Places">
  <button id="placesClose" aria-label="Close">&times;</button>
  <h2>PLACES</h2>
  <div id="placesList"></div>
</div>

<div id="pad" aria-hidden="true">
  <button data-dir="up" class="pb up">&#9650;</button>
  <button data-dir="left" class="pb left">&#9664;</button>
  <button data-dir="right" class="pb right">&#9654;</button>
  <button data-dir="down" class="pb down">&#9660;</button>
</div>
<button id="btnA" aria-label="Talk">A</button>

<script src="game.js"></script>
</body>
</html>
